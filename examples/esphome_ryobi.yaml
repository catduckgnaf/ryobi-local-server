# =============================================================================
# ESPHome configuration for Ryobi GDO local server integration
#
# Hardware:
#   - ESP8266 (Wemos D1 Mini) or ESP32
#   - Reed switch / magnetic door sensor wired to GPIO pin (state sensor)
#   - Relay module wired to garage door wall-button terminals (actuator)
#
# Wiring:
#   Reed switch: GPIO4 (D2 on D1 Mini) → GND  (closed = LOW = door closed)
#   Relay:       GPIO5 (D1 on D1 Mini) → relay IN pin
#                Relay COM/NO → wall button terminals on opener
#
# What this does:
#   1. Monitors the reed switch — when door state changes, POSTs to ryobi-local-server /state
#   2. Listens for commands from ryobi-local-server via the command_webhook endpoint
#      (when HA tells the server "open door", server POSTs here, we fire relay)
#
# Replace all <PLACEHOLDERS> before flashing.
# =============================================================================

substitutions:
  device_name: ryobi-gdo
  device_id: "GDO_XXXXXXXXXX"          # <-- Your Ryobi device varName
  server_ip: "192.168.1.100"           # <-- IP of your ryobi-local-server
  server_port: "80"

esphome:
  name: ${device_name}
  platform: ESP8266                     # change to ESP32 if using ESP32
  board: d1_mini                        # change to your board

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

captive_portal:

logger:
  level: INFO

api:
  password: !secret api_password

ota:
  password: !secret ota_password

# ---------------------------------------------------------------------------
# HTTP server — receives commands from ryobi-local-server
# (This is the command_webhook_url in config.yaml: http://<ESP_IP>/command)
# ---------------------------------------------------------------------------
web_server:
  port: 80

http_request:
  useragent: "ESPHome Ryobi GDO"
  timeout: 5s

# ---------------------------------------------------------------------------
# Reed switch / magnetic door sensor
# LOW = door closed (magnet present), HIGH = door open (magnet away)
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
    name: "${device_name} Door Reed Switch"
    id: door_reed_switch
    device_class: garage_door
    filters:
      - delayed_on: 200ms    # debounce
      - delayed_off: 200ms
    on_press:
      # Reed switch opened = door opened (magnet moved away)
      - logger.log: "Door OPENED detected by reed switch"
      - http_request.post:
          url: "http://${server_ip}:${server_port}/state"
          headers:
            Content-Type: application/json
          body: !lambda |-
            return "{\"device_id\":\"${device_id}\",\"door_state\":\"1\"}";
    on_release:
      # Reed switch closed = door closed (magnet back)
      - logger.log: "Door CLOSED detected by reed switch"
      - http_request.post:
          url: "http://${server_ip}:${server_port}/state"
          headers:
            Content-Type: application/json
          body: !lambda |-
            return "{\"device_id\":\"${device_id}\",\"door_state\":\"0\"}";

  # Optional: WiFi signal strength reporting
  - platform: wifi_info
    ip_address:
      name: "${device_name} IP"

# ---------------------------------------------------------------------------
# Relay — connected to wall button terminals
# Momentary pulse simulates a button press to toggle the door
# ---------------------------------------------------------------------------
switch:
  - platform: gpio
    pin: GPIO5
    name: "${device_name} Relay"
    id: door_relay
    restore_mode: ALWAYS_OFF
    internal: true       # hide from HA — HA controls via ryobi-local-server

# ---------------------------------------------------------------------------
# Script: momentary relay pulse (simulates wall button press)
# ---------------------------------------------------------------------------
script:
  - id: pulse_relay
    then:
      - switch.turn_on: door_relay
      - delay: 500ms
      - switch.turn_off: door_relay
      - logger.log: "Relay pulsed (door toggle)"

# ---------------------------------------------------------------------------
# Sensors
# ---------------------------------------------------------------------------
sensor:
  - platform: wifi_signal
    name: "${device_name} WiFi Signal"
    update_interval: 60s
    on_value:
      - http_request.post:
          url: "http://${server_ip}:${server_port}/state"
          headers:
            Content-Type: application/json
          body: !lambda |-
            return "{\"device_id\":\"${device_id}\",\"wifi_rssi\":" + to_string((int)x) + "}";

# ---------------------------------------------------------------------------
# HTTP endpoint to receive commands from ryobi-local-server
#
# Configure command_webhook_url in config.yaml to: http://<ESP_IP>/command
#
# ryobi-local-server will POST:
#   {"device_id":"GDO_XXX","module":"garageDoor","attr":"doorState","value":"1","command":"open"}
#
# ESPHome's web_server exposes /switch/door_relay/turn_on — but we need
# a custom endpoint. Use the ESPHome automation below to handle it.
#
# SIMPLER ALTERNATIVE: Set command_webhook_url to:
#   http://<ESP_IP>/switch/door_relay/turn_on
# and wire up a separate "on_turn_on" automation to pulse the relay.
# See the simplified approach below.
# ---------------------------------------------------------------------------

# Simplified approach: point command_webhook_url to the built-in ESPHome
# web_server endpoint to toggle the relay switch:
#   command_webhook_url: "http://192.168.1.50/switch/door_relay_pulse/turn_on"
#
# Add this switch which auto-pulses and turns off:
  - platform: gpio
    pin: GPIO5
    name: "${device_name} Door Trigger"
    id: door_relay_pulse
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 500ms
      - switch.turn_off: door_relay_pulse
