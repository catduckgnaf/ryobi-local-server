# Local Ryobi server plus the same DNS the Home Assistant add-on runs.
#
# DNS is required. ryobi-dns answers tti.tiwiconnect.com with this
# machine's LAN IP and forwards every other name upstream.
#
# Linux:
#   export RYOBI_HOST_IP=192.168.x.x
#   docker compose up -d
# Then set the router's LAN DNS server to that same address.
#
# Docker Desktop on Mac or Windows cannot answer LAN DNS this way.
# Use the Home Assistant add-on instead.

version: "3.8"

services:
  ryobi-local-server:
    build: .
    container_name: ryobi-local-server
    restart: unless-stopped
    ports:
      # 80 is http://tti.tiwiconnect.com (Home Assistant).
      # 443 is what the physical opener opens after DNS sends it here.
      - "80:8080"
      - "443:443"
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ryobi_state:/data
    # This process must not use the rewrite below. Clients do.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      LOG_LEVEL: INFO

  ryobi-dns:
    image: alpine:3.20
    container_name: ryobi-dns
    restart: unless-stopped
    network_mode: host
    environment:
      RYOBI_HOST_IP: ${RYOBI_HOST_IP:?required}
    volumes:
      - ./docker/dns-entrypoint.sh:/dns-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/dns-entrypoint.sh"]

volumes:
  ryobi_state:
