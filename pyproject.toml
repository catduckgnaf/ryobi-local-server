[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ryobi-local-server"
version = "1.2.0"
description = "Local TiwiConnect emulator for Ryobi GDO — replaces Ryobi's cloud on your LAN"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "aiofiles>=23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-aiohttp>=1.0",
    "aiohttp[speedups]>=3.9",
]

[project.scripts]
ryobi-server = "server.main:run"

# The server source lives inside the add-on folder because the Home Assistant
# builder can only see files in that folder. Docker and pip use the same copy.
[tool.setuptools.packages.find]
where = ["ryobi_gdo_local"]
include = ["server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["ryobi_gdo_local"]
