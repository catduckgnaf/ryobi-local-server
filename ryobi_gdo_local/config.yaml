---
name: "Ryobi GDO Local Server"
version: "1.0.4"
slug: "ryobi_gdo_local"
description: "Local TiwiConnect emulator for Ryobi GDO with built-in DNS redirect"
url: "https://github.com/catduckgnaf/ryobi-local-server"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
init: false
host_network: true
privileged:
  - NET_ADMIN
ingress: true
ingress_port: 8099
panel_icon: "mdi:garage"
panel_title: "Ryobi GDO"
environment:
  STATE_FILE: "/data/ryobi_state.json"
options:
  device_id: ""
  device_name: "Garage Door"
  log_level: "info"
  server_port: 80
  dns_enabled: true
  dns_port: 53
  command_webhook_url: ""
  command_webhook_timeout: 3
schema:
  device_id: "str"
  device_name: "str"
  log_level: "list(debug|info|warning|error)"
  server_port: "port"
  dns_enabled: "bool"
  dns_port: "port"
  command_webhook_url: "str?"
  command_webhook_timeout: "int?"
